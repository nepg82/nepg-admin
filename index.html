<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEPG Admin Preview</title>
  <link rel="stylesheet" href="nepg-admin.css">
  <style>
    body { margin: 0; min-height: 100vh; background: #d7d7d7; font-family: var(--nepg-font); }
    .launch { position: fixed; inset: 0; display: grid; place-items: center; gap: 10px; align-content: center; }
    .launch button { padding: 8px 18px; border: 2px outset #fff; background: #c0c0c0; font: inherit; }
    #out { max-width: 90vw; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="launch">
    <button id="open">Open NEPG Admin</button>
    <button id="push">Simulate push (requireAuth)</button>
    <div id="out"></div>
  </div>

  <script src="nepg-admin.js"></script>
  <script>
    // Demo "app state". Replace owner/repo with a real repo and use a real token to test live.
    let state = { vehicles: [{ name: "Demo bike", miles: 1234 }] };
    const out = document.getElementById("out");

    NEPGAdmin.init({
      appName: "GarageLog",
      github: { owner: "nepg82", repo: "garagelog", branch: "main" },
      data: {
        path: "data/garagelog.json",
        get: () => state,
        apply: (obj) => { state = obj; out.textContent = "Applied:\n" + JSON.stringify(state); }
      }
    });

    document.getElementById("open").onclick = () => NEPGAdmin.open();
    document.getElementById("push").onclick = async () => {
      try {
        const r = await NEPGAdmin.push("data/garagelog.json", JSON.stringify(state, null, 2), { message: "Demo push" });
        out.textContent = "Pushed: " + r.url;
      } catch (err) {
        out.textContent = "Push failed: " + err.message;
      }
    };
  </script>
</body>
</html>
