<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEPG Admin Preview</title>
  <link rel="stylesheet" href="nepg-admin.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #d7d7d7;
      font-family: var(--nepg-font);
    }
    .launch {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .launch button {
      padding: 8px 18px;
      border: 2px outset #fff;
      background: #c0c0c0;
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="launch">
    <button id="open">Open NEPG Admin Preview</button>
  </div>

  <script src="nepg-admin.js"></script>
  <script>
    document.getElementById("open").onclick = () => NEPGAdmin.open({
      appName: "GarageLog",
      github: {
        owner: "nepg82",
        repo: "garagelog",
        branch: "main",
        token: "ghp_EXAMPLE_TOKEN",
        rememberToken: true
      }
    });
  </script>
</body>
</html>
